version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_sdlc_postgres
    environment:
      POSTGRES_DB: ai_sdlc
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d ai_sdlc']
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: ai_sdlc_chromadb
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

volumes:
  postgres_data:
  chroma_data:
